[package]
name = "CLI-app"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.5", default-features = false, features = ["provider-http", "dyn-abi", "json-abi", "rpc-types", "reqwest-rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
